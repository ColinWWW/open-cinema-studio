name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR replaces its running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - run: pip install -r server/requirements.txt -r requirements.txt pytest ruff==0.16.9
      - name: Lint (ruff.toml)
        run: ruff check .
      - name: Server tests (the end-to-end ones start the mock ComfyUI and comfy-api-proxy)
        run: python -m unittest discover -s server/tests -t . -v
      - name: Script tests
        run: python -m pytest -q tests
      - name: Open-weights check
        run: python scripts/check_open_weights.py workflows/*.json
      - name: Committed workflows match server/workflow.py
        run: |
          python -m server.workflow
          if [ -n "$(git status --porcelain -- workflows/)" ]; then
            git diff -- workflows/
            echo "::error::workflows/*.json is stale: run python -m server.workflow and commit"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke test of the Pages build (Playwright, in the runner's Chrome so the H.264 demo clips decode)
        run: npm run test:e2e
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
